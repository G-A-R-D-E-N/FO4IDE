name: wiki-link-check

# Workflows belong in the main repository, not the special .wiki.git
# repository. The gollum event runs this workflow after a wiki page is
# created or updated; source changes, scheduled checks, and manual runs
# cover edits to the map and on-demand verification.
on:
  gollum:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (for the checker script)
        uses: actions/checkout@v4

      - name: Clone the wiki
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/G-A-R-D-E-N/FO4-IDE.wiki.git" "$RUNNER_TEMP/wiki"

      - name: Run the wiki link check
        run: python3 .github/scripts/check-wiki-links.py "$RUNNER_TEMP/wiki" "$GITHUB_WORKSPACE"
