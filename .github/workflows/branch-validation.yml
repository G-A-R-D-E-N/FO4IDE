name: Branch validation

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core-and-web:
    name: Portable core, server, and web


    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce source policy
        run: python3 tools/check-source-policy.py

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:





          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Build web bundle
        working-directory: web
        run: npm run build

      - name: Restore portable test project
        run: dotnet restore FO4RecordEditor.Core.Tests/FO4RecordEditor.Core.Tests.csproj

      - name: Build portable test project
        run: dotnet build FO4RecordEditor.Core.Tests/FO4RecordEditor.Core.Tests.csproj --configuration Release --no-restore

      - name: Run portable test suite
        run: dotnet test FO4RecordEditor.Core.Tests/FO4RecordEditor.Core.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Build cross-platform server
        run: dotnet build FO4RecordEditor.Server/FO4RecordEditor.Server.csproj --configuration Release







      - name: Restore Windows test project (compile gate)
        run: dotnet restore FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj -p:EnableWindowsTargeting=true

      - name: Compile Windows test project (compile gate)
        run: dotnet build FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true

  windows-compile:
    name: Windows compile (self-hosted)





    runs-on: [self-hosted, Linux, X64, wine, msvc]
    # The runner service account is shared, so Wine state must not overlap.
    concurrency:
      group: fo4-ide-wine-build
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build web bundle for desktop output
        working-directory: web
        run: npm run build

      - name: Restore Windows test project
        run: dotnet restore FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj -p:EnableWindowsTargeting=true

      - name: Build Windows shell and test project
        run: dotnet build FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true

  windows-tests:
    name: Windows integration tests













    if: vars.RUN_WINDOWS_TESTS == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:



          dotnet-version: |
            10.0.x
            9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build web bundle for desktop output
        working-directory: web
        run: npm run build

      - name: Restore Windows test project
        run: dotnet restore FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj -p:EnableWindowsTargeting=true

      - name: Build Windows shell and test project
        run: dotnet build FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true

      - name: Run Windows integration test suite
        env:





          FO4RE_TEST_DATA: ${{ vars.FO4RE_TEST_DATA }}
        run: dotnet test FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
